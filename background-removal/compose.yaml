services:
  background-removal:
    build: .
    ports:
      - "${BACKGROUND_REMOVAL_PORT:-7000}:7000"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
      REMBG_HOME: /models
    volumes:
      - rembg-models:/models
    restart: unless-stopped

volumes:
  rembg-models: